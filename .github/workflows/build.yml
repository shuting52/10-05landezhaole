name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      release_body:
        description: "Release notes（可选）"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # v1.1.13：大仓库（dist 含大量 APK）全量历史 fetch 触发服务器端 pack 打包错误（unresolved deltas），
          # 改为浅克隆 + 稀疏检出：只拉构建所需的 app/console-apk/gradle/根配置，dist 无需检出（上传走 gh api）
          fetch-depth: 1
          sparse-checkout: |
            app
            console-apk
            gradle
            .github
          sparse-checkout-cone-mode: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          save-always: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore secrets (签名密钥)
        env:
          LZDZ_KEYSTORE_BASE64: ${{ secrets.LZDZ_KEYSTORE_BASE64 }}
          LZDZ_KEYSTORE_PASSWORD: ${{ secrets.LZDZ_KEYSTORE_PASSWORD }}
          LZDZ_KEY_ALIAS: ${{ secrets.LZDZ_KEY_ALIAS }}
          LZDZ_KEY_PASSWORD: ${{ secrets.LZDZ_KEY_PASSWORD }}
          CONSOLE_KEYSTORE_BASE64: ${{ secrets.CONSOLE_KEYSTORE_BASE64 }}
          CONSOLE_KEYSTORE_PASSWORD: ${{ secrets.CONSOLE_KEYSTORE_PASSWORD }}
          CONSOLE_KEY_ALIAS: ${{ secrets.CONSOLE_KEY_ALIAS }}
          CONSOLE_KEY_PASSWORD: ${{ secrets.CONSOLE_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p signing
          # debug.keystore 回退：secrets 未配置时下载公开跟踪的 debug.keystore（与 auto-release.yml 一致，保证可出包）
          # 双源下载：raw 直链优先，jsDelivr CDN 兜底（raw 偶发网络抖动）
          curl -sL --retry 3 --retry-all-errors -o debug.keystore \
            "https://raw.githubusercontent.com/shuting52/landezhaole10-02/main/debug.keystore" \
            || curl -sL --retry 3 --retry-all-errors -o debug.keystore \
            "https://cdn.jsdelivr.net/gh/shuting52/landezhaole10-02@main/debug.keystore"
          ls -la debug.keystore
          if [ -n "$LZDZ_KEYSTORE_BASE64" ]; then
            echo "==> 解密本体 keystore"
            echo "$LZDZ_KEYSTORE_BASE64" | base64 -d > signing/lzdz-release.keystore
            cp signing/lzdz-release.keystore my-upload-key.jks
            ls -la signing/ my-upload-key.jks
          else
            echo "::warning::未配置 LZDZ_KEYSTORE_BASE64，本体将回退 debug 签名"
          fi
          if [ -n "$CONSOLE_KEYSTORE_BASE64" ]; then
            echo "==> 解密控制台 keystore"
            echo "$CONSOLE_KEYSTORE_BASE64" | base64 -d > signing/lzdz-console.keystore
            ls -la signing/
          else
            echo "::warning::未配置 CONSOLE_KEYSTORE_BASE64，控制台将回退 debug 签名"
          fi

      - name: Build 本体 (landezha)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/signing/lzdz-release.keystore
          STORE_PASSWORD: ${{ secrets.LZDZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LZDZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LZDZ_KEY_PASSWORD }}
        run: |
          set -e
          ./gradlew :app:assembleRelease --no-daemon
        continue-on-error: true

      - name: Build 控制台 (yuntai console)
        env:
          CONSOLE_KEYSTORE_PATH: ${{ github.workspace }}/signing/lzdz-console.keystore
          CONSOLE_STORE_PASSWORD: ${{ secrets.CONSOLE_KEYSTORE_PASSWORD }}
          CONSOLE_KEY_ALIAS: ${{ secrets.CONSOLE_KEY_ALIAS }}
          CONSOLE_KEY_PASSWORD: ${{ secrets.CONSOLE_KEY_PASSWORD }}
        run: |
          set -e
          # 控制台是独立 Gradle 项目，需用 -p 指定项目目录单独构建
          ./gradlew -p console-apk :app:assembleRelease --no-daemon
        continue-on-error: true

      - name: 收集 APK（规范命名）
        id: collect
        run: |
          set -e
          mkdir -p dist-artifacts
          TS=$(date +%s)
          BODY_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "unknown")
          CONSOLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' console-apk/app/build.gradle.kts || echo "unknown")
          echo "本体版本: $BODY_VERSION | 控制台版本: $CONSOLE_VERSION"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist-artifacts/landezhao-v${BODY_VERSION}-${TS}.apk"
            echo "收集到本体 APK"
          fi
          if [ -f console-apk/app/build/outputs/apk/release/app-release.apk ]; then
            cp console-apk/app/build/outputs/apk/release/app-release.apk "dist-artifacts/console-apk-v${CONSOLE_VERSION}-${TS}.apk"
            echo "收集到控制台 APK"
          fi
          echo "ARTIFACTS_DIR=dist-artifacts" >> $GITHUB_OUTPUT
          ls -la dist-artifacts/

      - name: 上传到工作流 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist-artifacts/

      - name: 推送到 dist/apk 与 dist/console
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          upload_file() {
            local f="$1" target="$2"
            local b64file sha
            # base64 写入临时文件，避免 jq 命令行参数超限（Argument list too long）
            b64file=$(mktemp)
            base64 -w0 "$f" > "$b64file"
            sha=$(gh api "repos/${{ github.repository }}/contents/$target" -q '.sha // empty' 2>/dev/null || true)
            echo "==> 上传 $(basename $f) -> $target (sha=${sha:0:7})"
            if [ -n "$sha" ]; then
              jq -n --rawfile c "$b64file" --arg msg "ci: 发布 $(basename $f)" --arg s "$sha" '{message:$msg, content:$c, sha:$s}' \
                | gh api -X PUT -H "Accept: application/vnd.github+json" "repos/${{ github.repository }}/contents/$target" --input -
            else
              jq -n --rawfile c "$b64file" --arg msg "ci: 发布 $(basename $f)" '{message:$msg, content:$c}' \
                | gh api -X PUT -H "Accept: application/vnd.github+json" "repos/${{ github.repository }}/contents/$target" --input -
            fi
            rm -f "$b64file"
          }
          for f in dist-artifacts/*.apk; do
            [ -f "$f" ] || continue
            if [[ "$f" == *"console"* ]]; then
              upload_file "$f" "dist/console/$(basename $f)"
            else
              upload_file "$f" "dist/apk/$(basename $f)"
            fi
          done

      - name: 创建 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.apk
          generate_release_notes: true
          body: ${{ github.event.inputs.release_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
