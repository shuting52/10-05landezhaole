// 手机下载 APK：Android WebView 内用原生下载器；浏览器内用隐藏 iframe 触发下载（修复手机无法下载的问题）
function downloadApkMobile(url, name){
  // 1. 云台 APK 内：调用原生系统下载管理器
  try{
    if(typeof Android !== "undefined" && Android.download){
      Android.download(url, name);
      toast("已开始下载，请查看通知栏","ok");
      return;
    }
  }catch(e){}
  // 2. 隐藏 iframe 触发下载（对 GitHub raw 的 APK 可触发浏览器直接下载，避免新开页面）
  try{
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.src = url;
    document.body.appendChild(iframe);
    setTimeout(()=>{ if(iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 60000);
    toast("已开始下载 " + (name||"") + "，请查看下载记录/通知栏","ok");
    return;
  }catch(e){}
  // 3. 兜底：当前页面直接跳转（GitHub raw 会响应下载）
  try{
    location.href = url;
  }catch(e){
    toast("下载失败，请长按链接选择保存","err");
  }
}

async function deleteApk(name){
  const ok = await confirmDlg(`删除仓库中的 APK「${name}」？\n（删除后不可恢复，建议保留当前生效版本）`);
  if(!ok) return;
  try{
    const meta = await ghGet("dist/apk/" + name);
    const url = `${apiBase()}/repos/${S.owner}/${S.repo}/contents/dist/apk/${name}`;
    const r = await fetch(url, {
      method: "DELETE",
      headers: ghHeaders(true),
      body: JSON.stringify({ message: "console: 删除 APK " + name, sha: meta.sha })
    });
    if(!r.ok) throw new Error("删除失败 HTTP " + r.status);
    toast("APK 已删除","ok");
    await fetchRepoApks(false);
  }catch(e){
    toast("删除失败："+e.message,"err");
  }
}

async function fetchRepoApks(showToast = true){
  if(!S.token || !S.owner || !S.repo) return;
  try{
    const data = await ghGet("dist/apk");
    if(Array.isArray(data)){
      S.apks = data.filter(x => x.name.endsWith(".apk"));
    } else {
      S.apks = [];
    }
    renderApk();
    if(showToast) toast(`检测到 ${S.apks.length} 个仓库 APK 安装包`,"ok");
  }catch(e){
    // 目录可能暂未创建
    S.apks = [];
    renderApk();
    if(showToast) toast("仓库检测：暂未发现 dist/apk 目录","warn");
  }
}

// v1.7.4：手动一键清理旧版本 APK，只保留当前发布版本 + 最新一个（共两个）
async function manualCleanupApks(){
  if(!S.token || !S.owner || !S.repo){ toast("请先连接","err"); return; }
  if(!S.apks || !S.apks.length){ toast("仓库暂无 APK 可清理","warn"); return; }
  const ok = await confirmDlg(`将清理仓库中多余的旧版本 APK，只保留当前发布版本与最新一个（共两个）。\n当前仓库有 ${S.apks.length} 个，将删除 ${Math.max(0, S.apks.length - 2)} 个。确定继续吗？`);
  if(!ok) return;
  // 按文件名倒序（新版本命名通常含更大时间戳/版本号）
  const sorted = [...S.apks].sort((a,b) => b.name.localeCompare(a.name));
  const currentName = (S.admin && S.admin.version && S.admin.version.apkUrl || "").split("/").pop();
  const keep = new Set();
  if(currentName) keep.add(currentName);
  sorted.forEach(a => { if(keep.size < 2) keep.add(a.name); });
  const toDelete = sorted.filter(a => !keep.has(a.name));
  if(!toDelete.length){ toast("无需清理，仓库已是新旧两个版本","ok"); return; }
  for(const a of toDelete){
    try{ await ghDelete("dist/apk/" + a.name, a.sha); }catch(e){ console.warn("删除失败", a.name, e); }
  }
  toast(`✅ 已清理 ${toDelete.length} 个旧版本 APK，仅保留新旧两个版本`,"ok");
  await fetchRepoApks(false);
}

async function handleUploadApkToRepo(ev){
  const f = ev.target.files[0]; if(!f) return;
  const status = $("apkUploadStatus");
  status.innerHTML = `⏳ 正在将 ${esc(f.name)} (${Math.round(f.size/1048576*10)/10}MB) 上传至 GitHub 仓库…`;
  try{
    const url = await uploadFile(f, "dist/apk");

    toast("APK 上传至仓库成功！","ok");
    // 自动刷新仓库列表
    await fetchRepoApks(false);
    // 询问是否直接触发更新弹窗
    confirmDlg(`APK ${f.name} 已成功入库，是否立即发布新版本并触发本体软件更新弹窗？`).then(ok=>{
      if(ok){

      }
    });

    status.innerHTML = `❌ 上传失败：${esc(e.message)}`;
    toast("上传失败："+e.message,"err");
  }

async function setAsReleaseApk(url, filename){
  if(!S.admin){ toast("请先连接","err"); return; }
  S.admin.version = S.admin.version || {};
  S.admin.version.code = (parseInt(S.admin.version.code) || 1) + 1;
  const baseName = $("fApkVerName") ? $("fApkVerName").value.trim() : "";
  if(baseName) S.admin.version.name = baseName;
  else {
    const base = S.admin.version.name || "2.1.0";
    S.admin.version.name = base.replace(/(\d+)\.(\d+)$/, (m,a,b)=>a+"."+(Number(b)+1));
  }
  S.admin.version.apkUrl = url;
  S.admin.version.apkUrlRaw = url.replace(/^https:\/\/raw\.githubusercontent\.com\//,"https://github.com/").replace(/\/main\//,"/raw/main/");
  const desc = $("fApkDesc") && $("fApkDesc").value.trim() ? $("fApkDesc").value.trim() : `新版本 APK 制作入库 (${filename})`;
  if(!S.admin.version.changelog) S.admin.version.changelog = [];
  S.admin.version.changelog.unshift(desc);
  S.admin.updateDialog = S.admin.updateDialog || { title: "发现新版本", changelog: [], confirmText: "立即更新", cancelText: "稍后再说" };
  S.admin.updateDialog.changelog = [desc, ...(S.admin.updateDialog.changelog||[])].slice(0, 8);
  toast(`正在发布并同步更新弹窗 (v${S.admin.version.name} code:${S.admin.version.code})…`,"ok");
  await publish(true, desc);
  renderAll();
}

  const codeRaw = ($("fConVerCode")?.value || "").trim();

// UI 文本编辑页搜索与筛选状态（保持输入/切分区时不丢失未保存表单草稿）
let __uiTextSearchQuery = "";
let __uiTextSecFilter = "all";   // all | 开屏 | 首页 | 软件库 | Skill 提示词区 | Skill 技能库 | 工具箱 | 设置页 | 弹窗/通用 | 自定义文本
let __uiTextStateFilter = "all"; // all | overridden | default

function getUiTextSections(){
  return [
    { name:"开屏", ico:"✨",   match:k=>/^splash|^welcome/.test(k) },
    { name:"首页", ico:"🏠",   match:k=>/^home|^search|^lucky|^select|^allSites|^reroll|^tabHome/.test(k) },
    { name:"软件库", ico:"📦", match:k=>/^software|^tabSoftware/.test(k) },
    { name:"Skill 提示词区", ico:"🧠", match:k=>/^promptTab|^skillNoPrompt|^skillEmpty|^skillDownload|^skillJump/.test(k) },
    { name:"Skill 技能库", ico:"💡", match:k=>/^skillTab|^tabSkill/.test(k) },
    { name:"工具箱", ico:"🧰", match:k=>/^tool|^tabToolbox/.test(k) },
    { name:"设置页", ico:"⚙️", match:k=>/^settings|^about|^contact|^feedback|^checkUpdate|^themeTitle|^tabSettings/.test(k) },
    { name:"弹窗/通用", ico:"🔄", match:k=>/^btn|^empty|^update|^marquee|^slogan/.test(k) }
  ];
}

// 高亮匹配到的关键词
function highlightUiTextMatch(text, query){
  const safe = esc(text || "");
  if(!query) return safe;
  const qSafe = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if(!qSafe) return safe;
  try{
    return safe.replace(new RegExp("(" + qSafe + ")", "gi"), '<mark style="background:rgba(250,204,21,.45);color:inherit;padding:0 2px;border-radius:3px">$1</mark>');
  }catch(e){
    return safe;
  }
}

// 判断单条 UI 文本配置是否命中搜索词与状态筛选
function matchUiTextItem(d, secName, ut, isCustom){
  const key = d.key || "";
  const cur = (typeof ut[key] === "string" && ut[key].trim() !== "") ? ut[key] : (d.def || "");
  const overridden = (typeof ut[key] === "string" && ut[key].trim() !== "");

  // 1. 分区过滤
  if(__uiTextSecFilter !== "all" && __uiTextSecFilter !== secName) return false;

  // 2. 状态过滤（全部 / 已覆盖 / 默认）
  if(__uiTextStateFilter === "overridden" && !overridden) return false;
  if(__uiTextStateFilter === "default" && overridden) return false;

  // 3. 关键词过滤（支持空格分词多条件匹配：界面分区名 / label / key / 说明 hint / 默认文案 / 当前覆盖值）
  const q = (__uiTextSearchQuery || "").trim().toLowerCase();
  if(!q) return true;
  const haystack = [
    secName || "",
    d.label || "",
    key,
    d.hint || "",
    d.def || "",
    cur || "",
    isCustom ? "自定义" : "预设",
    overridden ? "已覆盖 已修改" : "默认"
  ].join(" ").toLowerCase();

  const tokens = q.split(/\s+/).filter(Boolean);
  return tokens.every(tok => haystack.indexOf(tok) !== -1);
}

function setUiTextSearch(val){
  collectUiTextForm();
  __uiTextSearchQuery = val || "";
  renderUiTextBodyOnly();
}

function clearUiTextFilters(){
  collectUiTextForm();
  __uiTextSearchQuery = "";
  __uiTextSecFilter = "all";
  __uiTextStateFilter = "all";
  const inp = $("uiTextSearchInput");
  if(inp) inp.value = "";
  renderUiText();
}

function setUiTextSecFilter(sec){
  collectUiTextForm();
  __uiTextSecFilter = sec || "all";
  renderUiText();
}

function setUiTextStateFilter(st){
  collectUiTextForm();
  __uiTextStateFilter = st || "all";
  renderUiText();
}

function quickFilterUiText(keyword, sec){
  collectUiTextForm();
  if(typeof sec === "string") __uiTextSecFilter = sec;
  if(typeof keyword === "string") __uiTextSearchQuery = keyword;
  renderUiText();
}

function renderUiText(){
  if(!S.admin) return;
  if(!S.admin.uiText) S.admin.uiText = {};
  if(!S.admin.uiTextDefs) S.admin.uiTextDefs = [];
  // 重绘前先同步当前 DOM 输入框中尚未保存的改动，防止切换过滤条件时丢失输入内容
  collectUiTextForm();

  const ut = S.admin.uiText;
  const allDefs = UI_TEXT_DEFS.concat(S.admin.uiTextDefs);
  const SECTIONS = getUiTextSections();
  const customDefs = S.admin.uiTextDefs;
  const overriddenTotal = allDefs.filter(d => typeof ut[d.key] === "string" && ut[d.key].trim() !== "").length;

  const secChips = [{ name:"all", label:"全部界面", ico:"📑", count: allDefs.length }]
    .concat(SECTIONS.map(s => ({
      name: s.name,
      label: s.name,
      ico: s.ico,
      count: allDefs.filter(d => s.match(d.key)).length
    })))
    .concat(customDefs.length ? [{ name:"自定义文本", label:"自定义文本", ico:"➕", count: customDefs.length }] : []);

  let html = `<div class="action-banner">
      <b>✏️ UI 文本全面管理（本体所有文字/按钮/标题）</b>
      <span class="hint">支持按界面（如设置、弹窗、首页）或关键词实时搜索过滤；改完点「💾 保存」再点「✅ 应用」即实时同步仓库与本体。留空=本体默认。</span>
    </div>
    <div class="row" style="margin:8px 0 6px">
      <button class="btn-pri grow" onclick="saveUiText()">💾 保存</button>
      <button class="btn-ok" onclick="applyToDevice()">✅ 应用并实时同步</button>
      <button class="btn-bump" onclick="publish(true,'UI文本更新')">🚀 触发更新弹窗</button>
    </div>

    <!-- 搜索与快速过滤栏 -->
    <div style="margin:8px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.32)">
      <div class="row" style="gap:6px;align-items:center">
        <div style="position:relative;flex:1;display:flex;align-items:center">
          <input id="uiTextSearchInput"
                 value="${esc(__uiTextSearchQuery)}"
                 oninput="setUiTextSearch(this.value)"
                 placeholder="🔍 搜索界面/标题/按钮/Key/默认文案（如：设置、弹窗、更新、欢迎、搜索框…）"
                 style="width:100%;padding-right:62px">
          ${__uiTextSearchQuery ? `<button class="btn-mini" onclick="setUiTextSearch('');if($('uiTextSearchInput')){$('uiTextSearchInput').value='';$('uiTextSearchInput').focus();}" style="position:absolute;right:6px;padding:3px 8px;font-size:11px">✕ 清空</button>` : ""}
        </div>
        ${(__uiTextSearchQuery || __uiTextSecFilter !== "all" || __uiTextStateFilter !== "all")
          ? `<button class="btn-mini err" onclick="clearUiTextFilters()" title="重置所有搜索与筛选条件">↺ 重置筛选</button>`
          : ""}
      </div>

      <!-- 界面分区快速过滤胶囊 -->
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center">
        <span style="font-size:11px;color:var(--tx2);font-weight:600">界面定位：</span>
        ${secChips.map(c => {
          const active = __uiTextSecFilter === c.name;
          return `<button type="button" class="btn-mini ${active ? 'pri' : ''}"
            style="border-radius:999px;padding:4px 10px;font-size:11.5px;${active ? 'font-weight:700;' : 'opacity:.85;'}"
            onclick="setUiTextSecFilter('${c.name}')">${c.ico} ${esc(c.label)} <span style="opacity:.75">(${c.count})</span></button>`;
        }).join("")}
      </div>

      <!-- 状态过滤 + 常用词快捷检索 -->
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
          <span style="font-size:11px;color:var(--tx2);font-weight:600">状态：</span>
          <button type="button" class="btn-mini ${__uiTextStateFilter === 'all' ? 'pri' : ''}" style="border-radius:999px;padding:3px 9px;font-size:11px" onclick="setUiTextStateFilter('all')">全部 (${allDefs.length})</button>
          <button type="button" class="btn-mini ${__uiTextStateFilter === 'overridden' ? 'pri' : ''}" style="border-radius:999px;padding:3px 9px;font-size:11px" onclick="setUiTextStateFilter('overridden')">🟢 已修改/覆盖 (${overriddenTotal})</button>
          <button type="button" class="btn-mini ${__uiTextStateFilter === 'default' ? 'pri' : ''}" style="border-radius:999px;padding:3px 9px;font-size:11px" onclick="setUiTextStateFilter('default')">⚪ 默认未改 (${allDefs.length - overriddenTotal})</button>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
          <span style="font-size:11px;color:var(--tx2)">高频词：</span>
          ${["设置","弹窗","按钮","标题","更新","欢迎","开屏"].map(kw =>
            `<span class="chip" style="cursor:pointer;user-select:none;${__uiTextSearchQuery===kw?'background:var(--pri);color:#fff':''}" onclick="quickFilterUiText('${kw}','all')">${kw}</span>`
          ).join("")}
        </div>
      </div>
    </div>

    <div id="uiTextListContainer">${buildUiTextListHtml()}</div>`;

  $("uiTextPage").innerHTML = `<div class="card">${html}</div>`;
}

// 仅局部刷新列表区域（搜索框打字时不重建 input 元素，避免输入法失焦或光标跳动）
function renderUiTextBodyOnly(){
  const box = $("uiTextListContainer");
  if(!box){
    renderUiText();
    return;
  }
  box.innerHTML = buildUiTextListHtml();
}

function buildUiTextListHtml(){
  if(!S.admin) return "";
  if(!S.admin.uiText) S.admin.uiText = {};
  if(!S.admin.uiTextDefs) S.admin.uiTextDefs = [];
  const ut = S.admin.uiText;
  const allDefs = UI_TEXT_DEFS.concat(S.admin.uiTextDefs);
  const SECTIONS = getUiTextSections();
  const customDefs = S.admin.uiTextDefs;
  const q = (__uiTextSearchQuery || "").trim();

  let html = "";
  let matchedCount = 0;

  SECTIONS.forEach(sec => {
    const secAllDefs = allDefs.filter(d => sec.match(d.key));
    if(!secAllDefs.length) return;
    const defs = secAllDefs.filter(d => matchUiTextItem(d, sec.name, ut, customDefs.some(c => c.key === d.key)));
    if(!defs.length) return;
    matchedCount += defs.length;

    html += `<div class="sec-title"><span>${sec.ico}</span>${highlightUiTextMatch(sec.name, q)}<span class="st-badge">${defs.length}/${secAllDefs.length}</span>
      <span style="flex:1"></span>
      <button class="btn-mini pri" onclick="addUiTextDef('${sec.name}')">➕ 添加</button></div>`;
    defs.forEach(d => {
      const key = d.key;
      const cur = (typeof ut[key] === "string" && ut[key].trim() !== "") ? ut[key] : d.def;
      const overridden = (typeof ut[key] === "string" && ut[key].trim() !== "");
      const isCustom = customDefs.some(c => c.key === key);
      html += `<div style="margin-top:8px;border:1px solid ${overridden ? "var(--ok)" : "var(--line)"};border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.25)">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <b style="font-size:13px">${highlightUiTextMatch(d.label, q)}${isCustom ? " <span class='chip' style='background:rgba(245,158,11,.2);color:#d97706'>自定义</span>" : ""}</b>
          <span class="chip" style="font-family:monospace;font-size:10.5px;opacity:.8">${highlightUiTextMatch(key, q)}</span>
          <span class="hint" style="flex:1">${highlightUiTextMatch(d.hint, q)}</span>
          ${overridden ? `<span class="chip" style="background:#14351f;color:#4ade80">已覆盖</span>` : `<span class="chip" style="background:#262251;color:#a5b4fc">默认</span>`}
          ${isCustom ? `<button class="btn-mini err" onclick="removeUiTextDef('${key}')" title="永久删除该文本记录">🗑 删除</button>` : `<button class="btn-mini err" onclick="resetUiTextKey('${key}')" title="清空覆盖（恢复本体默认）">↩ 恢复默认</button>`}
        </div>
        <input id="ut_${key}" value="${esc(cur)}" style="margin-top:6px;width:100%" placeholder="${esc(d.def)}">
        <div style="margin-top:4px;font-size:11px;color:var(--tx2);opacity:.75">本体默认：${highlightUiTextMatch(d.def, q)}${overridden ? "（当前已覆盖）" : ""}</div>
      </div>`;
    });
  });

  // 自定义区
  if(customDefs.length){
    const filteredCustom = customDefs.filter(d => matchUiTextItem(d, "自定义文本", ut, true));
    if(filteredCustom.length){
      matchedCount += filteredCustom.length;
      html += `<div class="sec-title"><span>➕</span>${highlightUiTextMatch("自定义文本", q)}<span class="st-badge">${filteredCustom.length}/${customDefs.length}</span>
        <span style="flex:1"></span>
        <button class="btn-mini pri" onclick="addUiTextDef()">➕ 添加</button></div>`;
      filteredCustom.forEach(d => {
        const key = d.key;
        const cur = (typeof ut[key] === "string" && ut[key].trim() !== "") ? ut[key] : "";
        const overridden = (typeof ut[key] === "string" && ut[key].trim() !== "");
        html += `<div style="margin-top:8px;border:1px solid ${overridden ? "var(--ok)" : "var(--line)"};border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.25)">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <b style="font-size:13px">${highlightUiTextMatch(d.label, q)} <span class="chip" style="background:rgba(245,158,11,.2);color:#d97706">自定义</span></b>
            <span class="chip" style="font-family:monospace;font-size:10.5px;opacity:.8">${highlightUiTextMatch(key, q)}</span>
            <span class="hint" style="flex:1">${d.hint ? highlightUiTextMatch(d.hint, q) : ""}</span>
            <button class="btn-mini err" onclick="removeUiTextDef('${key}')" title="永久删除该文本记录">🗑 删除</button>
          </div>
          <input id="ut_${key}" value="${esc(cur)}" style="margin-top:6px;width:100%" placeholder="输入覆盖文字">
        </div>`;
      });
    }
  }

  if(matchedCount === 0){
    html += `<div style="margin:18px 0;padding:24px 14px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--tx2)">
      <div style="font-size:24px;margin-bottom:6px">🔍</div>
      <div style="font-size:13px;font-weight:700">未找到匹配的 UI 文本配置</div>
      <div style="font-size:11.5px;margin-top:4px;opacity:.8">尝试更换搜索关键词（如「设置」「弹窗」「更新」「按钮」）或切换上方筛选条件</div>
      <button class="btn-mini pri" style="margin-top:10px" onclick="clearUiTextFilters()">↺ 显示全部 (${allDefs.length})</button>
    </div>`;
  }

  const isFiltered = Boolean(q || __uiTextSecFilter !== "all" || __uiTextStateFilter !== "all");
  html += `<div style="margin-top:12px;font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
    <span>${isFiltered ? `当前筛选命中 <b>${matchedCount}</b> 项 / ` : ""}共 ${allDefs.length} 个可管理文本（${UI_TEXT_DEFS.length} 预设 + ${customDefs.length} 自定义）</span>
    ${isFiltered ? `<a href="javascript:void(0)" onclick="clearUiTextFilters()" style="color:var(--pri);font-size:12px">清除筛选</a>` : ""}
  </div>`;
  return html;
}
// 恢复默认（预设字段：清空覆盖）
function resetUiTextKey(key){
  if(!S.admin || !S.admin.uiText) return;
  collectUiTextForm();
  delete S.admin.uiText[key];
  const el = $("ut_" + key);
  if(el){
    const defObj = UI_TEXT_DEFS.find(d => d.key === key);
    el.value = defObj ? (defObj.def || "") : "";
  }
  renderUiText();
  toast("已恢复本体默认", "ok");
}

// v1.2.0：添加自定义 UI 文本字段（key 需唯一）；v1.4.0：改用独立输入弹窗
function addUiTextDef(secName){
  if(!S.admin){ toast("请先连接并加载数据","err"); return; }
  if(!S.admin.uiTextDefs) S.admin.uiTextDefs = [];
  askInput("字段 Key（字母/数字/下划线，如 myTitle）", "", (k0)=>{
    const k = (k0||"").trim();
    if(!k) return;
    const exists = UI_TEXT_DEFS.some(d => d.key === k) || S.admin.uiTextDefs.some(d => d.key === k);
    if(exists){ toast("该 Key 已存在","err"); return; }
    if(!/^[A-Za-z0-9_]+$/.test(k)){ toast("Key 只能包含字母/数字/下划线","err"); return; }
    askInput("显示名称（中文，如 我的标题）", k, (l0)=>{
      const label = (l0||"").trim() || k;
      askInput("本体默认值（可留空）", "", (d0)=>{
        const def = (d0||"").trim() || "";
        askInput("说明（可选，如属于哪个界面）", "", (h0)=>{
          const hint = (h0||"").trim() || "";
          S.admin.uiTextDefs.push({ key: k, label: label, def: def, hint: hint });
          renderUiText();
          toast("已添加自定义字段：" + k + (secName?(" 到「"+secName+"」"):""), "ok");
        });
      });
    });
  });
}

// v1.2.0：删除自定义 UI 文本字段
function removeUiTextDef(key){
  if(!S.admin) return;
  collectUiTextForm();
  S.admin.uiTextDefs = (S.admin.uiTextDefs||[]).filter(d => d.key !== key);
  if(S.admin.uiText) delete S.admin.uiText[key];
  renderUiText();
  toast("已删除自定义字段：" + key, "ok");
}

// v1.2.8：统一收集 UI 文本输入框 → S.admin.uiText（保存与应用共用，杜绝漏收集丢改动）
function collectUiTextForm(){
  if(!S.admin) return;
  if(!S.admin.uiTextDefs) S.admin.uiTextDefs = [];
  const allDefs = UI_TEXT_DEFS.concat(S.admin.uiTextDefs);
  allDefs.forEach(d => {
    const el = $("ut_" + d.key);
    if(!el) return;
    const v = el.value.trim();
    const ut = S.admin.uiText || (S.admin.uiText = {});
    if(v === "" || v === d.def){ delete ut[d.key]; }  // 等于默认/留空 → 移除覆盖，用本体默认
    else { ut[d.key] = v; }
  });
}

function saveUiText(){
  if(!S.admin){ toast("请先连接并加载数据","err"); return; }
  if(!S.admin.uiText) S.admin.uiText = {};
  collectUiTextForm();
  const ut = S.admin.uiText;
  const allDefs = UI_TEXT_DEFS.concat(S.admin.uiTextDefs || []);
  const count = allDefs.filter(d => typeof ut[d.key] === "string" && ut[d.key].trim() !== "").length;
  renderUiText();
  toast(count > 0 ? ("已保存 " + count + " 处文字覆盖，点「✅ 应用并实时同步」推送到本体") : "所有文字均为默认值（已清除覆盖），点「✅ 应用」生效", count > 0 ? "ok" : "warn");
  logChange(count > 0 ? "保存 UI 文本（" + count + " 处覆盖）" : "UI 文本恢复默认");
}

function resetUiText(i){
  const d = UI_TEXT_DEFS[i];
  if(!d || !S.admin) return;
  if(S.admin.uiText) delete S.admin.uiText[d.key];
  renderUiText();
}

// ============ 导出 / 导入 ============
function exportJson(){
  if(!S.admin){ toast("请先连接","err"); return; }
  const blob = new Blob([JSON.stringify(S.admin, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "admin-data-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  toast("备份已导出","ok");
}

function importJson(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const obj = JSON.parse(rd.result);
      if(!obj.home || !obj.version){ toast("不是有效的 admin-data.json","err"); return; }
      S.admin = obj; S.sha = null; S.loaded = true;
      renderAll();
      toast("导入成功，请点击发布推送到云端","ok");
    }catch(e){ toast("解析失败："+e.message,"err"); }
  };
  rd.readAsText(f);
}

// ============ 页面加载自启动 ============
loadCfg();
renderAll();
// 自动连接并加载云端
setTimeout(() => {
  connect();
}, 200);

</script>

<div class="bottom-actions">
  <button class="ba-apply" title="应用：实时同步到本体软件（不升版本号、不弹窗）" onclick="applyToDevice()">⚡ 应用</button>
  <button class="ba-bump" title="触发更新弹窗：递增版本号，本体软件即刻弹出更新窗口" onclick="quickBumpPublish()">🚀 发布</button>
  <button class="ba-diag" title="连接诊断：测试 API 与镜像通道" onclick="runDiagnosis()">🔍 诊断</button>
</div>
</body>
