name: Verify Console v2 Kotlin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare signing key
        run: |
          curl -sL --retry 3 --retry-all-errors -o debug.keystore \
            "https://raw.githubusercontent.com/shuting52/landezhaole10-02/main/debug.keystore" \
            || curl -sL --retry 3 --retry-all-errors -o debug.keystore \
            "https://cdn.jsdelivr.net/gh/shuting52/landezhaole10-02@main/debug.keystore"
          ls -la debug.keystore

      # Kotlin 层（数据层/模型/ViewModel）编译验证；
      # UI 层为 jadx 反编译 Java（可读，含反编译伪代码，不参与 Java 编译）
      - name: Compile Kotlin layer
        run: |
          ./gradlew -p console-apk-v2 :app:compileReleaseKotlin --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
