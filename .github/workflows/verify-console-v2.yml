name: Verify Console v2 Kotlin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare signing key
        run: |
          curl -sL --retry 3 --retry-all-errors -o debug.keystore \
            "https://raw.githubusercontent.com/shuting52/landezhaole10-02/main/debug.keystore" \
            || curl -sL --retry 3 --retry-all-errors -o debug.keystore \
            "https://cdn.jsdelivr.net/gh/shuting52/landezhaole10-02@main/debug.keystore"
          ls -la debug.keystore

      # 完整构建 Console v2 Release APK（Kotlin 层 + UI 层全部参与编译）
      # 说明：UI 层正在逐步由 jadx 反编译 Java 改写为 Kotlin Compose，
      #       构建成功即可产出 v2.1.1 发布包，供 2.1.0 旧版控制台检测更新。
      - name: Build Console v2 Release APK
        run: |
          ./gradlew -p console-apk-v2 :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
          ls -la console-apk-v2/app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-v2-apk
          path: console-apk-v2/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
